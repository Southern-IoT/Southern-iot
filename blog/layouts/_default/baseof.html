<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary/30 industrial-grid min-h-screen flex flex-col">
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  <script>
  document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
    const menu = document.getElementById('mobile-menu');
    menu?.classList.toggle('hidden');
    menu?.classList.toggle('flex');
  });
  </script>
</body>
</html>
