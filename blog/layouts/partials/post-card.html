<article class="glass-panel rounded-xl overflow-hidden group hover:border-primary/30 transition-all flex flex-col">
  <a class="aspect-video overflow-hidden block" href="{{ .RelPermalink }}">
    <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="{{ .Params.image }}" alt="{{ .Title }}"/>
  </a>
  <div class="p-6 flex flex-col flex-grow">
    <div class="flex items-center justify-between mb-4">
      <span class="text-secondary font-label-caps">{{ index (.Params.categories | default (slice "Insights")) 0 }}</span>
      <span class="text-on-tertiary-container font-label-caps">{{ .ReadingTime }} Min Read</span>
    </div>
    <h3 class="font-headline-md text-white mb-4 group-hover:text-primary transition-colors"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="font-body-sm text-on-surface-variant mb-6 flex-grow">{{ .Summary | plainify | truncate 150 }}</p>
    <div class="flex items-center gap-3 pt-6 border-t border-white/5">
      <div class="w-8 h-8 rounded-full bg-primary-fixed-dim flex items-center justify-center text-on-primary-fixed font-bold text-xs">{{ .Params.authorInitials }}</div>
      <div>
        <p class="text-white font-label-caps text-[10px]">{{ .Params.author }}</p>
        <p class="text-on-surface-variant text-[10px]">{{ .Params.authorTitle }}</p>
      </div>
    </div>
  </div>
</article>
